<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d7377" />
    <title>لا يوجد اتصال — Dental Suite</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Beiruti', 'Segoe UI', system-ui, sans-serif;
            color: #0b2e30; padding: 24px;
            background: radial-gradient(circle at 6% 4%, #c7f2ea 0%, transparent 38%),
                        radial-gradient(circle at 97% 92%, #f6c6bc 0%, transparent 26%), #eafbfc;
        }
        .card {
            background: rgba(255,255,255,.88); border-radius: 22px; padding: 36px 28px; max-width: 380px; width: 100%;
            text-align: center; box-shadow: 0 20px 50px rgba(10,77,79,.10);
        }
        img { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 18px; }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        p { color: #4b6b6c; margin: 0 0 22px; line-height: 1.8; font-size: .95rem; }
        button {
            border: 0; border-radius: 12px; padding: 12px 26px; font: inherit; font-weight: 700; color: #fff; cursor: pointer;
            background: linear-gradient(135deg, #0d7377, #14b8a6); box-shadow: 0 10px 24px rgba(13,115,119,.28);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="icons/icon-192.png" alt="" />
        <h1>لا يوجد اتصال بالخادم</h1>
        <p>تأكد من اتصال الجهاز بشبكة العيادة أو بالإنترنت، ثم أعد المحاولة.<br />البيانات المحفوظة لم تتأثر.</p>
        <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
